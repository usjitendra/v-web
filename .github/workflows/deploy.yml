name: Deploy Doctore Backend

on:
  push:
    branches:
      - maint

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }} # ✅ correct
          key: ${{ secrets.EC2_SSH_KEY }} # ✅ correct
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin maint
            npm install
            pm2 restart Doctore-backend
